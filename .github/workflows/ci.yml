name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Browser safety
        run: pnpm check:browser

      - name: Scope
        run: pnpm check:scope

      # A checker's --self-test exits 1 when it rejects its bad fixture, which is what it must do, and 2 when the fixture
      # slipped through. A crash also exits 1, so the expected line has to be there as well.
      - name: Browser safety self-test
        run: |
          code=0
          output=$(node scripts/check-browser.mjs --self-test 2>&1) || code=$?
          echo "$output"
          test "$code" -eq 1
          grep -qF 'check-browser self-test: scripts/fixtures/node-import.mjs rejected as expected' <<< "$output"

      - name: Scope self-test
        run: |
          code=0
          output=$(node scripts/check-scope.mjs --self-test 2>&1) || code=$?
          echo "$output"
          test "$code" -eq 1
          grep -qF 'check-scope self-test: stale scopes rejected as expected, correct workspace accepted' <<< "$output"
